[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "braze-toolkit"
version = "0.1.0"
description = "Typed, batch-aware Python client for the Braze REST API (users/track, Catalogs, campaigns) with rate-limit retries."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "Ian Pansensoy" }]
dependencies = ["httpx>=0.24"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.hatch.build.targets.wheel]
packages = ["src/braze_toolkit"]

[tool.pytest.ini_options]
pythonpath = ["src"]
